name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --cov=agent_daily_digest
      - run: python examples/prepare.py && digest --config examples/config.yaml --data-dir /tmp/digest-example scan && digest --config examples/config.yaml --data-dir /tmp/digest-example today --json
