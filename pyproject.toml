[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-daily-digest"
version = "0.1.0"
description = "A local dashboard and daily reports for multiple AI assistants."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.20,<2", "markdown-it-py>=3,<5", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "httpx>=0.27,<1", "reportlab>=4,<5"]

[project.scripts]
digest = "agent_daily_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_daily_digest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
